# =============================================================================
# Helm frontend Nginx config
#
# Two SPAs are served from one nginx instance, selected by the request Host
# header. Both proxy `/api/*` to the API service running in the same network.
#
#   admin.*  -> /usr/share/nginx/html/admin   (apps/admin)
#   default  -> /usr/share/nginx/html/web     (apps/web)
# =============================================================================

# Shared gzip + cache settings applied via map/include in each server block.

# --- Admin SPA -------------------------------------------------------------
# Matches admin.tracktheturn.com (production) and any other admin.* host
# (e.g. admin.gethelm.com, admin.<preview>.replit.app).
server {
    listen 80;
    server_name admin.tracktheturn.com admin.gethelm.com ~^admin\..+$;

    root /usr/share/nginx/html/admin;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Cache static assets aggressively; Vite filenames are content-hashed.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API requests to the api service.
    location /api {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA routing — serve admin's index.html for any non-file route so deep
    # links like /tenants/:id work on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# --- Web SPA (default) -----------------------------------------------------
# Catches every other Host (app.tracktheturn.com, *.gethelm.com tenant
# subdomains, container IP / preview URL, etc.).
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html/web;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
