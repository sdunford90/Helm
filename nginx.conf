# =============================================================================
# nginx.conf: Helm web tier (Dockerfile.web). Installed as an nginx
# *template*, so ${API_UPSTREAM} is filled from the container environment
# at startup (default "api:3001", the docker-compose service). Only variables
# that are actually set get substituted; nginx's own $variables are left alone.
#
#   /              apps/web SPA (marina dashboard). Unknown paths -> index.html
#   /assets/       Vite content-hashed bundles: cached for a year, immutable
#   /widgets/      apps/widgets ES modules, embeddable on marina websites
#   /api/          reverse proxy to the Helm API
#   /healthz       container liveness probe
#
# TLS is terminated in front of this container (load balancer / platform
# edge). Listens on 8080 because the image runs as a non-root user.
# =============================================================================

# --- Per-path header values --------------------------------------------------
# All headers are set once at server level from these maps. nginx drops
# inherited add_header directives in any location that sets its own, so
# locations below avoid add_header (except /api/, which opts out on purpose).
# An empty value means "don't send this header".

# Embedding: the dashboard must never be framed (clickjacking). Widgets are
# meant to be embedded on marina websites, so they allow any ancestor.
map $uri $helm_frame_options {
    ~^/widgets/   "";
    default       "DENY";
}
# Enforced CSP, frame-ancestors only. Browsers ignore frame-ancestors inside a
# Report-Only policy, so it must be sent enforced.
map $uri $helm_csp_enforced {
    ~^/widgets/   "frame-ancestors *";
    default       "frame-ancestors 'none'";
}

# Full CSP, REPORT-ONLY to start. Watch the browser console (and later a
# report endpoint) for violations, then promote it to Content-Security-Policy.
# Allows Clerk (dev *.clerk.accounts.dev and the production Frontend API on
# clerk.gethelm.com), Cloudflare Turnstile (Clerk bot protection) and Stripe.
map $uri $helm_csp_report_only {
    ~^/widgets/   "";
    default       "default-src 'self'; script-src 'self' https://*.clerk.accounts.dev https://clerk.gethelm.com https://challenges.cloudflare.com https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.clerk.accounts.dev https://clerk.gethelm.com https://api.stripe.com; frame-src https://*.clerk.accounts.dev https://clerk.gethelm.com https://challenges.cloudflare.com https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'";
}

# Widgets load cross-origin as <script type="module">, which needs CORS.
map $uri $helm_cors_origin {
    ~^/widgets/   "*";
    default       "";
}
map $uri $helm_corp {
    ~^/widgets/   "cross-origin";
    default       "same-origin";
}

# Caching: Vite emits content-hashed names under /assets/ (and hashed shared
# chunks for widgets), so those are immutable. Widget entry files have stable,
# unhashed names that marinas hard-code in their sites, so keep them short.
# index.html and other unhashed files must revalidate so deploys show up at once.
map $uri $helm_cache_control {
    ~^/assets/                              "public, max-age=31536000, immutable";
    "~^/widgets/.+-[A-Za-z0-9_-]{8}\.js$"   "public, max-age=31536000, immutable";
    ~^/widgets/                             "public, max-age=300";
    default                                 "no-cache";
}

# HSTS without includeSubDomains on purpose: tenants can bring a custom
# (possibly apex) domain, and includeSubDomains would force HTTPS on all of
# the marina's other subdomains. Set includeSubDomains/preload for
# *.gethelm.com at the edge instead (see docs/DEPLOYMENT.md).
map $uri $helm_hsts {
    default "max-age=31536000";
}

# Keep the client's original scheme when a TLS-terminating proxy is in front;
# fall back to this hop's scheme for direct (local) access.
map $http_x_forwarded_proto $helm_forwarded_proto {
    ""        $scheme;
    default   $http_x_forwarded_proto;
}

# Only send "Connection: upgrade" upstream on real WebSocket upgrades.
map $http_upgrade $helm_connection_upgrade {
    default   upgrade;
    ""        "";
}

upstream helm_api {
    server ${API_UPSTREAM};
    keepalive 16;
}

server {
    # IPv4 only: an IPv6 listen makes nginx exit on hosts without IPv6.
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Body limit for uploads proxied to the API (insurance docs, photos).
    client_max_body_size 25m;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # --- Security headers (inherited by every location without add_header) ---
    add_header Strict-Transport-Security          $helm_hsts               always;
    add_header X-Content-Type-Options             "nosniff"                always;
    add_header Referrer-Policy                    "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy                 "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\")" always;
    add_header X-Frame-Options                    $helm_frame_options      always;
    add_header Content-Security-Policy            $helm_csp_enforced       always;
    add_header Content-Security-Policy-Report-Only $helm_csp_report_only   always;
    add_header Cross-Origin-Resource-Policy       $helm_corp               always;
    add_header Access-Control-Allow-Origin        $helm_cors_origin        always;
    # No "always": errors (e.g. a 404 for a missing chunk) must not be cached
    # as immutable.
    add_header Cache-Control                      $helm_cache_control;

    # --- Liveness ------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API reverse proxy ---------------------------------------------------
    # The API (helmet) sets its own security headers. This location's
    # add_header deliberately stops the static-site headers above from being
    # added on top, so CSP/X-Frame-Options aren't duplicated. Only HSTS is
    # normalised to the value used everywhere else.
    location = /api {
        return 308 /api/;
    }
    location ^~ /api/ {
        proxy_pass http://helm_api;
        proxy_http_version 1.1;

        # Tenancy is resolved from the Host header, so pass it unchanged.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $helm_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $helm_connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        # Stream webhooks/uploads straight through.
        proxy_request_buffering off;

        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Powered-By;
        add_header Strict-Transport-Security $helm_hsts always;
    }

    # --- Static: hashed bundles ----------------------------------------------
    # A missing chunk must 404, not fall back to index.html (that would serve
    # HTML as JS and hide stale-deploy problems).
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # --- Static: embeddable widgets ------------------------------------------
    location ^~ /widgets/ {
        try_files $uri =404;
    }

    # --- SPA fallback --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
